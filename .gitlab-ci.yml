stages: [test, brief]

image: python:3.12

cache:
  key: pip
  paths:
    - .cache/pip

lint-and-test:
  stage: test
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - when: always
  script:
    - python -m pip install --upgrade pip
    - pip install -r requirements.txt
    - pip install ruff pytest pytest-cov
    - mkdir -p data
    - ruff check .
    - pytest tests/ -q --cov=src --cov=tests --cov-report=term

nightly-brief:
  stage: brief
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - pip install -r requirements.txt
    - python main.py brief --persist --notify
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        curl -s -X POST -H "Content-Type: application/json" \
          -d '{"content":"Nightly brief failed — check GitLab job log"}' \
          "$NOTIFY_WEBHOOK_URL" || true
      fi