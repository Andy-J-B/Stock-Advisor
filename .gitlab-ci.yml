stages: [dispatch]

nightly-brief-dispatch:
  stage: dispatch
  image: curlimages/curl:latest
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      curl --fail-with-body -s -X POST -w "\ndispatch HTTP %{http_code}\n" \
        -H "Accept: application/vnd.github+json" \
        -H "Authorization: Bearer $GITHUB_DISPATCH_TOKEN" \
        -d '{"event_type":"nightly-brief"}' \
        https://api.github.com/repos/Andy-J-B/Stock-Advisor/dispatches
  after_script:
    - |
      if [ "$CI_JOB_STATUS" = "failed" ]; then
        curl -s -X POST -H "Content-Type: application/json" \
          -d '{"content":"Nightly brief dispatch to GitHub failed — check GitLab job log"}' \
          "$NOTIFY_WEBHOOK_URL" || true
      fi