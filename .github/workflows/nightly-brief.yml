name: Nightly Brief

on:
  schedule:
    - cron: "53 19 * * 1-5" # 14:53 PDT (21:53 UTC) — weekdays only
  repository_dispatch:
    types: [nightly-brief]
  workflow_dispatch: {} # manual trigger for testing

jobs:
  brief:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run nightly brief
        run: python main.py brief --persist --notify
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          DATABASE_REST_URL: ${{ secrets.SUPABASE_REST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          NEWSAPI_API_KEY: ${{ secrets.NEWSAPI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"Nightly brief failed — check Actions log"}' \
            "$NOTIFY_WEBHOOK_URL" || true
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}

  newsletter:
    needs: brief
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send daily newsletter email
        run: python main.py newsletter
        env:
          DATABASE_REST_URL: ${{ secrets.SUPABASE_REST_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_FROM_NAME: ${{ secrets.EMAIL_FROM_NAME }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST \
            -H "Content-Type: application/json" \
            -d '{"content":"Newsletter failed — check Actions log"}' \
            "$NOTIFY_WEBHOOK_URL" || true
        env:
          NOTIFY_WEBHOOK_URL: ${{ secrets.NOTIFY_WEBHOOK_URL }}
